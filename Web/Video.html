<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Frame</title>
  </head>
  <body>
    <p>Embedding YouTube Videos Using Iframe</p>
    <iframe
      src="https://youtube.com/embed/aAoZEVZykcA"
      title="Pole Pole Soothing Swahili Love Songs for Relaxation &amp; Romance"
      width="900"
      height="480"
      frameborder="0"
      allowfullscreen
    ></iframe>
    <br />
    <p>Embedding mp4 videos using video tag</p>
    <video width="900" height="480" controls>
      <source
        src="/Asserts/WhatsApp Video 2025-01-26 at 5.00.27 PM.mp4"
        type="video/mp4"
      />
      Your Browser does not support the video tag</video
    ><br />
    <p>Adding Audio using audio tag</p>
    <audio controls>
      <source src="/Asserts/a solidad.mp3" type="audio/mp3" />
      Your Browser does not support the audio tag
    </audio>
    <br />
    <p>Embedding Google Map using iframe tag</p>
    <iframe
      src="https://maps.google.com/maps?width=600&amp;height=400&amp;hl=en&amp;q=nyahururu&amp;t=k&amp;z=14&amp;ie=UTF8&amp;iwloc=B&amp;output=embed"
      frameborder="0"
      width="600"
      height="450"
      loading="lazy"
    ></iframe>

</html>
