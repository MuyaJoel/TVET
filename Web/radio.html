<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web design</title>
</head>
<body>
    <div>
        <h1><i><u>EMPLOYEE DETAILS</u></i></h1>
        <form action="submit">
            <label for="name">Name:</label>
            <input type="text" name="name" placeholder="Enter your name" required><br><br>
            <label for="phone">Phone No:</label>
            <input type="text" name="phone" id="phone" placeholder="Enter phone number" required><br><br>
            <label for="email">Email Address:</label>
            <input type="email" name="email" id="email" placeholder="example@gmail.com" required><br><br>
            <label for="psd">Password</label>
            <input type="password" name="psd" id="psd" placeholder="Enter your password" min="6" max="8" required><br><br>
            <label for="gender">Gender:</label><br>
            Male <input type="radio" name="gender" id="gender" checked> <br>
            Female <input type="radio" name="gender" id="gender"><br><br>
            <label for="nationality">Kenyan</label><br>
            Yes <input type="radio" name="nationality" id="nationality" checked><br>
            No <input type="radio" name="nationality" id="nationality">
        </form>
    </div>
    
</body>
</html>
