<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table,th,td{
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <table>
        <caption>Week Timetable</caption>
        <tr>
            <th width="50px">Mon</th>
            <th width="50px">Tue</th>
            <th width="50px">Wed</th>
            <th width="50px">Thur</th>
        </tr>
        <tr>
            <td width="50px">Eat</td>
            <td width="50px">Play</td>
            <td width="50px">Learn</td>
            <td width="50px">Nature Walk</td>
        </tr>
    </table>
    
</body>
</html>
