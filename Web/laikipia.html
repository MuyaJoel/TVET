<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <h2>Registration Page.</h2>
        <form action="submit">
            <label for="name">Full Names:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your full names."><br>
            <label for="reg no">Registration Number:</label><br>
            <input type="text" id="reg no" name="reg no" placeholder="Enter your Registration Number."><br>
            <label for="psd">Password:</label><br>
            <input type="password" name=""psd id="psd" min="6" max="8" placeholder="Enter your password"><br>
            <label for="course">Course:</label><br>
            <input type="text" name="course" id="course" placeholder="Enter your course."><br>
            <label for="yearofstudy">Year of Study:</label><br>
            <input type="number" id="yearofstudy" name="yearofstudy" placeholder="Enter your year of study."><br>
            <input type="button" value="Click to Register">
        </form>
    </div>
    <div>
        <h2>Login Page.</h2>
        <form action="submit">
            <label for="reg no">Registration Number:</label><br>
            <input type="text" id="reg no" name="reg no" placeholder="Enter your Registration Number."><br>
            <label for="psd">Password:</label><br>
            <input type="password" name=""psd id="psd" min="6" max="8" placeholder="Enter your password"><br>
            <input type="button" value="Click to Login">
        </form>
    </div>
    <div>
        <h2>Units Registration.</h2>
        <form action="submit">
            <input type="checkbox" name="units" id="units" value="Web design" checked> Web Design<br>
            <input type="checkbox" name="units" id="units" value="Management Information System">Management Information System <br>
            <input type="checkbox" name="units" id="units" value="Database Management Sysytem">Database Management System <br>
            <input type="checkbox" name="units" id="units" value="System Analysis and Design">System Analysis and Design <br>
            <input type="button" value="Submit">
        </form>
    </div>
</body>
</html>
